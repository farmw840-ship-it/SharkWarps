name: Build SharkWarps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compilar SharkWarps
        run: gradle build

      - name: Salvar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: SharkWarps
          path: build/libs/*.jar
